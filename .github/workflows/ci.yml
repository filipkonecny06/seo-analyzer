name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs only need repository contents; checkout also avoids retaining its temporary credential.
permissions:
  contents: read

# New commits supersede older runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Exercise every Node major declared in package.json rather than testing only the newest runtime.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      # Commit SHAs make third-party action updates explicit; comments retain the readable release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node-version == '24'
        run: npm run audit:production

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag seo-analyzer:test .
      - name: Start container and probe health endpoint
        shell: bash
        run: |
          set -euo pipefail
          # Loopback-only publishing keeps the CI probe unreachable from external network interfaces.
          container_id="$(docker run --detach --env PORT=3102 --publish 127.0.0.1:3102:3102 seo-analyzer:test)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..15}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3102/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Container health check did not become ready." >&2
          exit 1
